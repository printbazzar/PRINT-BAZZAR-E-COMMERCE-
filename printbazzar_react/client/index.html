<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pb.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Bazzar | Online Custom Printing & Graphic Design</title>
    
    <!-- Edge Preconnect & DNS Prefetch for Instant API & Assets Delivery -->
    <link rel="preconnect" href="https://printbazzar-api.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://printbazzar-api.onrender.com" />

    <style>
      /* Critical First Contentful Paint (FCP) Inline Styles (< 50ms) */
      .pb-shell {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #ffffff;
        min-height: 100vh;
        color: #111827;
      }
      .pb-shimmer {
        background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
        background-size: 200% 100%;
        animation: pbShimmer 1.5s infinite ease-in-out;
      }
      @keyframes pbShimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <!-- Pre-warm sleeping Render container non-blockingly while JavaScript downloads -->
    <script>
      (function() {
        try {
          fetch('/api/health', { method: 'GET', cache: 'no-store' }).catch(function(){});
          fetch('/api/v1/categories', { method: 'GET' }).catch(function(){});
        } catch(e) {}
      })();
    </script>

    <div id="root">
      <!-- Instant First Contentful Paint Shell: Displayed instantly before React bundle executes -->
      <div class="pb-shell">
        <!-- Top Navbar Mock -->
        <div style="border-bottom: 1px solid #f3f4f6; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; max-width: 1280px; margin: 0 auto;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 32px; height: 32px; background: #facc15; border-radius: 8px; font-weight: 900; display: flex; align-items: center; justify-content: center; font-size: 14px;">PB</div>
            <span style="font-weight: 900; font-size: 18px; letter-spacing: -0.5px;">PRINT BAZZAR</span>
          </div>
          <div class="pb-shimmer" style="width: 220px; height: 36px; border-radius: 12px;"></div>
        </div>

        <!-- Hero Banner Skeleton -->
        <div style="max-width: 1280px; margin: 16px auto; padding: 0 16px;">
          <div class="pb-shimmer" style="width: 100%; height: 220px; border-radius: 16px;"></div>
        </div>

        <!-- Product Grid Skeleton -->
        <div style="max-width: 1280px; margin: 24px auto; padding: 0 16px;">
          <div class="pb-shimmer" style="width: 260px; height: 24px; border-radius: 6px; margin-bottom: 16px;"></div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;">
            <div style="background: #ffffff; border: 1px solid #f3f4f6; border-radius: 16px; padding: 12px;">
              <div class="pb-shimmer" style="width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px;"></div>
              <div class="pb-shimmer" style="width: 80%; height: 16px; border-radius: 4px; margin-bottom: 8px;"></div>
              <div class="pb-shimmer" style="width: 40%; height: 14px; border-radius: 4px;"></div>
            </div>
            <div style="background: #ffffff; border: 1px solid #f3f4f6; border-radius: 16px; padding: 12px;">
              <div class="pb-shimmer" style="width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px;"></div>
              <div class="pb-shimmer" style="width: 80%; height: 16px; border-radius: 4px; margin-bottom: 8px;"></div>
              <div class="pb-shimmer" style="width: 40%; height: 14px; border-radius: 4px;"></div>
            </div>
            <div style="background: #ffffff; border: 1px solid #f3f4f6; border-radius: 16px; padding: 12px;">
              <div class="pb-shimmer" style="width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px;"></div>
              <div class="pb-shimmer" style="width: 80%; height: 16px; border-radius: 4px; margin-bottom: 8px;"></div>
              <div class="pb-shimmer" style="width: 40%; height: 14px; border-radius: 4px;"></div>
            </div>
            <div style="background: #ffffff; border: 1px solid #f3f4f6; border-radius: 16px; padding: 12px;">
              <div class="pb-shimmer" style="width: 100%; aspect-ratio: 1/1; border-radius: 12px; margin-bottom: 12px;"></div>
              <div class="pb-shimmer" style="width: 80%; height: 16px; border-radius: 4px; margin-bottom: 8px;"></div>
              <div class="pb-shimmer" style="width: 40%; height: 14px; border-radius: 4px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
